schema_version = "1.0"

artifacts = [
  "/app/verifier-artifacts/candidate.tar.gz",
  "/app/verifier-artifacts/candidate.sha256",
]

[metadata]
author_name = "Sidharth Rajmohan"
author_email = "micro1@example.invalid"
difficulty_explanation = "The task requires tracing a temporal-semantics regression through PromQL AST preprocessing and engine evaluation. A locally attractive optimization treats a fixed-time subquery as one reusable value, but a surrounding function can still require different results at each outer step. A Prometheus maintainer would diagnose this by reconciling parser structure, instant/range behavior, nested expressions, and regression coverage. The cases are derived from a real upstream regression rather than synthetic data."
solution_explanation = "The reference preserves step invariance inside a subquery while preventing the subquery node itself from being wrapped as a globally reusable expression. This retains the valid inner optimization but allows the caller to evaluate the subquery result correctly at every outer step."
verification_explanation = "After the agent phase, Harbor snapshots the candidate source into a checksum-addressed archive and destroys the agent container. A separate no-network verifier checks immutable module metadata, builds the submitted Prometheus server, and drives its HTTP API with verifier-owned fixed-time range and instant queries plus ordinary-subquery controls. A verifier-owned preprocessing probe also enforces the reviewed PromQL AST invariant: the subquery remains step-sensitive while invariant work inside it may still be wrapped. Clean-parent, reference, alternate-valid, and mutant calibration are separate author-side release gates rather than claims inferred by the per-trial verifier."
category = "SDLC"
tags = ["prometheus", "promql", "debugging", "query-engine", "temporal-semantics"]
expert_time_estimate_hours = 1.5
relevant_experience = "Prometheus query-engine internals, Go, temporal query semantics, and regression testing"

[verifier]
environment_mode = "separate"
timeout_sec = 900.0

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "no-network"

[[verifier.collect]]
timeout_sec = 120.0
user = "root"
command = '''
set -eu
for status_file in /proc/[0-9]*/status; do
  pid=${status_file#/proc/}; pid=${pid%/status}
  if test "$pid" = "1"; then continue; fi
  test "$(awk '/^Uid:/{print $2}' "$status_file")" != "1000" || kill -KILL "$pid" 2>/dev/null || true
done
chown -R root:root /app/prometheus
chmod -R a-w /app/prometheus
out=/app/verifier-artifacts
rm -rf "$out"
install -d -o root -g root -m 0700 "$out"
cd /app
/usr/bin/tar \
  --exclude='prometheus/.git' \
  --exclude='prometheus/.cache' \
  --exclude='prometheus/web/ui/node_modules' \
  --exclude='prometheus/prometheus' \
  --exclude='prometheus/promtool' \
  -czf "$out/candidate.tar.gz" prometheus
/usr/bin/sha256sum "$out/candidate.tar.gz" > "$out/candidate.sha256"
'''

[agent]
timeout_sec = 3600.0
user = "agent"

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "public"
