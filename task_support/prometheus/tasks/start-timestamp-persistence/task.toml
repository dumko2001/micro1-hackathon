schema_version = "1.0"
artifacts = ["/app/verifier-artifacts/candidate.tar.gz", "/app/verifier-artifacts/candidate.sha256"]

[metadata]
author_name = "Sidharth Rajmohan"
author_email = "micro1@example.invalid"
difficulty_explanation = "This upstream storage feature asks a Prometheus TSDB maintainer to coordinate integer and float histograms, chunk iteration and recoding, head and out-of-order paths, WAL/WBL reconstruction, blocks, independent feature gating, and queries. Each new on-disk encoding must stay consistent across append, iteration, replay, compaction, feature gating, and legacy reads; a local fix in one path can silently drop or corrupt data in another."
solution_explanation = "Introduce opt-in histogram start-timestamp encodings, independently gate them from XOR2, and carry them through append, chunk cut, replay, compaction, and query while retaining legacy encodings when disabled."
verification_explanation = "A separate verifier validates the checksummed artifact, restores pinned module metadata, and compiles with cgo disabled. A root-owned controller gives randomized integer and float histogram lifecycles to execute-only candidate binaries running as UID 65532 without capabilities. The controller discovers the independently effective histogram option through artifacts rather than a Go symbol name. A non-test candidate program performs WAL/WBL restart and normal/out-of-order compaction and emits TSDB artifacts containing mixed zero and nonzero start timestamps, large bucket deltas, varied schemas, counter-reset hints, gauges, a compatible within-series bucket-layout expansion, a zero-threshold transition, and stale-marker recovery. A verifier-owned reader compiled against candidate code uses only the pre-existing public query and iterator APIs plus the behaviorally discovered option. Reward requires its output to match the complete expected histogram semantics: schema, zero threshold and count, nonzero bucket populations keyed by side and index, custom bounds, counter-or-gauge state, count, sum, exact sample cardinality, and a fresh iterator Seek result. Equivalent span segmentation is accepted. A second root-only reader built from the exact landed patch must decode the same sealed blocks and return identical receipts, making the reviewed persistent wire format an explicit author-side conformance policy without requiring the candidate to use the patch's Go identifiers or source organization. A root-only writer compiled against the clean parent independently creates durable legacy integer and float artifacts; the candidate reader must recover those exactly with zero start timestamps. The controller also launches the candidate Prometheus binary with baseline, histogram-only, XOR2-only, and combined public feature flags and checks the externally reported TSDB feature states."
category = "Observability"
tags = ["prometheus", "tsdb", "wal", "chunk-encoding", "native-histogram", "feature-flag"]
expert_time_estimate_hours = 16.0
relevant_experience = "Prometheus TSDB internals, binary codecs, WAL/WBL replay, out-of-order storage, and compatibility design"

[verifier]
environment_mode = "separate"
timeout_sec = 1800.0

[verifier.environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "no-network"

[[verifier.collect]]
timeout_sec = 240.0
user = "root"
command = '''
set -eu
for status_file in /proc/[0-9]*/status; do
  pid=${status_file#/proc/}; pid=${pid%/status}
  if test "$pid" = "1"; then continue; fi
  test "$(awk '/^Uid:/{print $2}' "$status_file")" != "1000" || kill -KILL "$pid" 2>/dev/null || true
done
chown -R root:root /app/prometheus
rm -f /app/prometheus/go.work.sum
chmod -R a-w /app/prometheus
out=/app/verifier-artifacts
rm -rf "$out"
install -d -o root -g root -m 0700 "$out"
cd /app
/usr/bin/tar --exclude='prometheus/.git' --exclude='prometheus/.cache' --exclude='prometheus/web/ui/node_modules' --exclude='prometheus/prometheus' --exclude='prometheus/promtool' -czf "$out/candidate.tar.gz" prometheus
/usr/bin/sha256sum "$out/candidate.tar.gz" > "$out/candidate.sha256"
'''

[agent]
timeout_sec = 10800.0
user = "agent"

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "public"
