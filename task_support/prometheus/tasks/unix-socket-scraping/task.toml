schema_version = "1.0"
artifacts = ["/app/verifier-artifacts/candidate.tar.gz", "/app/verifier-artifacts/candidate.sha256"]

[metadata]
author_name = "Sidharth Rajmohan"
author_email = "micro1@example.invalid"
difficulty_explanation = "The feature crosses target relabeling, request construction, TLS identity, keep-alive pooling, reload, and fail-closed behavior. A Prometheus networking maintainer must preserve ordinary scraping while preventing real cross-target transport reuse. The source is the exact clean parent of the upstream Unix-socket feature, and the verifier's randomized local exporters reproduce the observable HTTP, TLS, pooling, reload, and fallback behavior exercised by that feature and its direct correction; they are synthetic fixtures, not production telemetry."
solution_explanation = "Recognize the relabeled socket path while preserving the advertised URL authority for HTTP Host and TLS identity, route those targets through a fail-closed Unix dialer, and key or own their HTTP transports so keep-alive connections cannot cross socket or TCP targets. Rebuild the isolated clients when targets reload while leaving ordinary TCP scraping unchanged."
verification_explanation = "After validating the archived workspace and pinned module files, a separate no-network verifier builds the candidate Prometheus daemon, deletes its source, and runs it non-root. A root-owned controller serves randomized HTTP, HTTPS, Unix-socket, and TCP endpoints, then checks Host and TLS identity, same-authority socket isolation, UDS/TCP separation, reload behavior, ordinary TCP scraping, and fail-closed handling. Missing sockets may be absent or report up=0, but a live TCP trap must receive no request throughout the two-second observation window."
category = "Observability"
tags = ["prometheus", "scraping", "unix-socket", "tls", "transport-isolation"]
expert_time_estimate_hours = 3.0
relevant_experience = "Go networking, Prometheus scrape manager, HTTP transport pooling, TLS, and reload behavior"

[verifier]
environment_mode = "separate"
timeout_sec = 1200.0

[verifier.environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "no-network"

[[verifier.collect]]
timeout_sec = 180.0
user = "root"
command = '''
set -eu
for status_file in /proc/[0-9]*/status; do
  pid=${status_file#/proc/}; pid=${pid%/status}
  if test "$pid" = "1"; then continue; fi
  test "$(awk '/^Uid:/{print $2}' "$status_file")" != "1000" || kill -KILL "$pid" 2>/dev/null || true
done
chown -R root:root /app/prometheus
chmod -R a-w /app/prometheus
out=/app/verifier-artifacts
rm -rf "$out"
install -d -o root -g root -m 0700 "$out"
cd /app
/usr/bin/tar --exclude='prometheus/.git' --exclude='prometheus/.cache' --exclude='prometheus/web/ui/node_modules' --exclude='prometheus/prometheus' --exclude='prometheus/promtool' -czf "$out/candidate.tar.gz" prometheus
/usr/bin/sha256sum "$out/candidate.tar.gz" > "$out/candidate.sha256"
'''

[agent]
timeout_sec = 3600.0
user = "agent"

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "public"
