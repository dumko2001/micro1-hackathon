[[criteria]]
name = "source_lineage"
description = "The task uses an immutable, licensed, reproducible pre-change source snapshot."
guidance = "Pass only when the exact clean parent or equivalent landed first-parent lineage, source archive checksum, merge anchor, and license are present and mutually consistent. Do not infer lineage from prose alone."

[[criteria]]
name = "reset_isolation"
description = "Every episode starts from fresh source and verifier-owned state."
guidance = "Check container construction and task configuration for a clean candidate tree, candidate outputs, verifier state, and task state on every trial. Flag reusable mutable state or host dependencies."

[[criteria]]
name = "agent_contract"
description = "Observation, action, termination, timeout, resources, and reward are coherent."
guidance = "Check the task configuration and instruction together. Require explicit bounded runtime and resources, a writable agent workspace, and a deterministic verifier phase."

[[criteria]]
name = "outcome_instruction"
description = "The instruction is concise, teammate-voiced, and outcome-focused without leaking the solution."
guidance = "Fail instructions that reveal target files, exact commands, hidden tests, verifier thresholds, patch structure, or root cause. Do not require hand-holding that a senior engineer can infer."

[[criteria]]
name = "separate_truth"
description = "Reward is produced from verifier-owned behavioral evidence after the agent phase."
guidance = "Require reward to come from the separate verifier, not candidate-authored tests, logs, self-reports, source-pattern matching, or process exit alone."

[[criteria]]
name = "artifact_binding"
description = "Harbor job, lock, trial, result, artifact manifest, and candidate tree can be immutably cross-linked."
guidance = "Require both candidate.tar.gz and candidate.sha256 collection. Pass runtime claims only with pinned Harbor-native hashes and IDs; static task files alone are insufficient."

[[criteria]]
name = "hostile_code_boundary"
description = "Candidate code cannot read or forge verifier truth."
guidance = "Inspect process, user, filesystem, and container boundaries. Fail if candidate-controlled code can write reward files, hidden tests, completion tokens, or trusted verifier inputs. Distinguish a separate verifier image from a truly external behavioral controller."

[[criteria]]
name = "behavioral_specificity"
description = "The verifier tests the requested semantics and meaningful regressions, not an implementation pattern."
guidance = "Look for positive, negative, edge, and regression cases at the real product boundary. An exact symbol or internal contract may be required only when it predates the change or follows an established repository convention visible at task time. Fail requirements for oracle-invented names, patch structure, or private helpers when an independently valid architecture could satisfy the public contract."

[[criteria]]
name = "task_time_epistemics"
description = "The agent receives the facts available to the engineer at task time, but not the oracle author's private reasoning."
guidance = "Permit public issue symptoms, reproducers, externally supplied requirements, and pre-change repository conventions. Fail prompts or actor-visible files that disclose private root-cause reasoning, patch layout, target files, hidden cases, reference commits, or an implementation route unavailable to the engineer before solving."

[[criteria]]
name = "original_fails_reference_passes"
description = "The clean parent fails and the reference implementation passes identical behavioral cases."
guidance = "Pass only with actual bound runtime evidence if reviewer evidence is supplied. Otherwise report fail rather than treating solution scripts or expected outcomes as measured proof."

[[criteria]]
name = "nop_rejected"
description = "A no-op receives reward zero without an infrastructure exception."
guidance = "Pass only with a completed bound no-op trial whose binary reward is zero and whose exception_info is null. Expected reward or static inspection is not runtime evidence."

[[criteria]]
name = "alternate_valid_accepted"
description = "An independently implemented, behaviorally equivalent solution receives reward one."
guidance = "Require an alternate-valid implementation that differs materially from the reference method plus a completed bound trial. A reference rerun, source rewrite, or claim is not a method-neutrality test."

[[criteria]]
name = "mutant_discrimination"
description = "Plausible partial, hardcoded, bypass, and regression mutants receive reward zero."
guidance = "Require named candidate mutants tied to the task crux and bound per-mutant results. Do not award this criterion from test-count or coverage claims alone."

[[criteria]]
name = "repeatability"
description = "Repeated clean runs agree and infrastructure failures are reported separately."
guidance = "Require at least two independent clean runs for repeated claims. Any timeout, provider error, build failure unrelated to the candidate, or missing artifact must remain an infrastructure failure rather than reward zero."

[[criteria]]
name = "same_case_fairness"
description = "Baseline and final evaluations use the identical immutable case corpus."
guidance = "Require stable case identifiers and hashes across compared candidates. Flag verifier edits or per-candidate case selection that invalidate the comparison."

[[criteria]]
name = "public_private_boundary"
description = "The public task excludes secrets and author-only calibration truth."
guidance = "Check for credentials, auth files, environment files, held-out cases, private thresholds, raw trajectories, reference patches, and calibration bindings leaking into actor-visible or public paths."
